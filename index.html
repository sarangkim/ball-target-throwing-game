<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>공던지기 타겟 챌린지</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell is-lobby">
      <section class="lobby-screen" aria-label="게임 로비">
        <div class="lobby-hero">
          <div class="brand lobby-brand">
            <span class="brand-mark">공</span>
            <div>
              <strong>공던지기 타겟 챌린지</strong>
              <span id="lobbyStatus">Google 로그인 후 친구에게 바로 도전하세요.</span>
            </div>
          </div>
          <div class="lobby-primary-actions">
            <button id="lobbyGoogleButton" type="button">Google 로그인</button>
            <button id="playComputerButton" type="button">컴퓨터와 게임하기</button>
          </div>
        </div>

        <div class="lobby-layout">
          <section class="lobby-board">
            <div class="lobby-board-header">
              <div>
                <strong>온라인 도전</strong>
                <span>로그인한 사람을 골라 바로 경기 신청</span>
              </div>
              <button id="refreshLobbyButton" type="button">새로고침</button>
            </div>
            <div id="challengeNotice" class="challenge-notice"></div>
            <div id="lobbyContent" class="lobby-content"></div>
          </section>

          <aside class="lobby-side">
            <div class="lobby-tabs">
              <button type="button" data-lobby-tab="players" class="active">도전</button>
              <button type="button" data-lobby-tab="profile">내정보</button>
              <button type="button" data-lobby-tab="missions">미션</button>
              <button type="button" data-lobby-tab="shop">상점</button>
              <button type="button" data-lobby-tab="help">도움말</button>
            </div>
            <div class="lobby-tip">
              접속자가 없으면 컴퓨터와 바로 연습할 수 있어요. 온라인 상대가 들어오면 도전 목록에 표시됩니다.
            </div>
          </aside>
        </div>
      </section>

      <section class="game-stage" aria-label="공던지기 게임">
        <canvas id="gameCanvas" width="960" height="620"></canvas>

        <div class="top-bar">
          <div class="brand">
            <span class="brand-mark">◎</span>
            <div>
              <strong>공던지기 타겟 챌린지</strong>
              <span id="roomStatus">컴퓨터 대전</span>
            </div>
          </div>

          <div class="controls">
            <button id="soundButton" type="button" title="음악 켜기/끄기">♪</button>
            <select id="difficultySelect" title="컴퓨터 난이도">
              <option value="easy">쉬움</option>
              <option value="normal" selected>보통</option>
              <option value="hard">어려움</option>
            </select>
            <button id="googleButton" type="button">Google 로그인</button>
            <button id="backToLobbyButton" type="button">로비</button>
            <button id="resetButton" type="button">새 경기</button>
          </div>
        </div>

        <aside class="score-panel" aria-label="점수판">
          <div class="round-banner">
            <span id="roundLabel">1라운드</span>
            <strong id="matchLabel">3판 2승</strong>
          </div>
          <div class="score-row active" id="playerOneRow">
            <span id="playerOneName">플레이어 1</span>
            <strong id="playerOneScore">0</strong>
          </div>
          <div class="score-row" id="playerTwoRow">
            <span id="playerTwoName">플레이어 2</span>
            <strong id="playerTwoScore">0</strong>
          </div>
          <div class="reward-row">
            <span>라운드 승리</span>
            <strong><span id="playerOneRounds">0</span> : <span id="playerTwoRounds">0</span></strong>
          </div>
          <div class="reward-row">
            <span>별 / 티켓</span>
            <strong><span id="starCount">0</span>★ / <span id="ticketCount">0</span></strong>
          </div>
          <div class="throw-info">
            <span>남은 공</span>
            <strong id="ballsLeft">3</strong>
          </div>
          <div class="mission" id="missionLabel">오늘의 미션 준비 중</div>
          <div class="item-panel" aria-label="아이템 공">
            <button type="button" data-item="magnet" title="판정 위치를 중심 쪽으로 살짝 끌어당깁니다.">자석 <span>1</span></button>
            <button type="button" data-item="double" title="이번 공 점수를 2배로 만듭니다.">두배 <span>1</span></button>
            <button type="button" data-item="giant" title="공이 커져서 점수판에 닿는 판정 범위가 넓어집니다.">왕공 <span>1</span></button>
            <button type="button" data-item="safe" title="과녁 밖으로 나가도 10점을 받습니다.">안전 <span>1</span></button>
            <button type="button" data-item="firework" title="과녁에 맞히면 폭죽 보너스 30점을 더합니다.">폭죽 <span>1</span></button>
          </div>
          <div class="history" id="throwHistory" aria-live="polite"></div>
        </aside>

        <div class="message" id="message" aria-live="polite">
          3판 2승 시작! 공을 뒤로 당겼다가 과녁을 향해 놓아보세요.
        </div>
      </section>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
